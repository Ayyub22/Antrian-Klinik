<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — KlinikQ</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="glass-card auth-card">
      <div class="text-center" style="margin-bottom:8px">
        <a href="index.html" class="navbar-brand" style="font-size:28px"><img src="assets/logo.png" alt="KlinikQ" style="height:40px;vertical-align:middle;margin-right:8px;border-radius:8px">KlinikQ</a>
      </div>
      <h2>Buat Akun</h2>
      <p class="subtitle">Daftar untuk mulai mengambil antrian online</p>
      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" class="form-control" placeholder="Masukkan nama lengkap" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="nama@email.com" required>
        </div>
        <div class="form-group">
          <label for="no_telp">No. Telepon</label>
          <input type="tel" id="no_telp" class="form-control" placeholder="08xxxxxxxxxx">
        </div>
        <div class="form-group">
          <label for="role">Daftar Sebagai</label>
          <select id="role" class="form-control">
            <option value="pasien">Pasien</option>
            <option value="admin">Admin / Dokter</option>
          </select>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Minimal 6 karakter" required>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Konfirmasi Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Ulangi password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Daftar</button>
      </form>
      <div class="auth-footer">
        Sudah punya akun? <a href="login.html">Masuk di sini</a>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>if(isLoggedIn()){const u=getUser();location.href=u.role==='admin'?'dashboard-admin.html':'dashboard-pasien.html';}</script>
</body>
</html>
