<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — KlinikQ</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="glass-card auth-card">
      <div class="text-center" style="margin-bottom:8px">
        <a href="index.html" class="navbar-brand" style="font-size:28px"><img src="assets/logo.png" alt="KlinikQ" style="height:40px;vertical-align:middle;margin-right:8px;border-radius:8px">KlinikQ</a>
      </div>
      <h2>Selamat Datang</h2>
      <p class="subtitle">Masuk ke akun Anda untuk melanjutkan</p>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="nama@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Masuk</button>
      </form>
      <div class="auth-footer">
        Belum punya akun? <a href="register.html">Daftar sekarang</a>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>if(isLoggedIn()){const u=getUser();location.href=u.role==='admin'?'dashboard-admin.html':'dashboard-pasien.html';}</script>
</body>
</html>
